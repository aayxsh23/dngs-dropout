name: Tracker

# Regenerates the project tracker (scripts/tracker.py, plan in docs/tracker/plan.yaml) and publishes
# README.md, PLAN.md, PROGRESS.md, REMAINING.md and FUTURE.md on the `tracker` branch. Status comes from
# evidence: merged PRs, tags, files on main and the **Tracker:** lines of both context files (team-context).
# Runs hourly, on every push to main, and on demand: gh workflow run tracker.yml --repo aayxsh23/dngs-dropout
# It never touches main; the `tracker` branch holds only generated files.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # push the generated files to the tracker branch
  pull-requests: read    # merged-PR evidence

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "pyyaml>=6"
      - name: Build the tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tracker.py --fetch --out "$RUNNER_TEMP/tracker" --summary | tee "$RUNNER_TEMP/summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the tracker branch
        run: |
          pub="$RUNNER_TEMP/pub"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin tracker >/dev/null; then
            git fetch -q origin tracker
            git worktree add -q --detach "$pub" origin/tracker
          else
            git worktree add -q --detach "$pub"
            git -C "$pub" checkout -q --orphan tracker
            git -C "$pub" rm -rqf .
          fi
          cp "$RUNNER_TEMP"/tracker/*.md "$pub/"
          cd "$pub"
          git add README.md PLAN.md PROGRESS.md REMAINING.md FUTURE.md
          # Only the "as of" time changed: nothing to publish.
          if git diff --cached --quiet -I ' · as of ' -I '^Tracker .* IST:'; then echo "no change"; exit 0; fi
          git commit -qm "tracker: $(head -1 "$RUNNER_TEMP/summary.txt" | cut -c1-150)"
          git push -q origin HEAD:refs/heads/tracker
