name: Tracker

# Regenerates the project tracker (scripts/tracker.py, plan in docs/tracker/plan.yaml) and publishes
# README.md, PLAN.md, PROGRESS.md, REMAINING.md and FUTURE.md on the `tracker` branch. Status comes from
# evidence: merged PRs, tags, files on main and the **Tracker:** lines of both context files (team-context).
# Runs hourly, on every push to main, and on demand: gh workflow run tracker.yml --repo aayxsh23/dngs-dropout
# Two jobs, so repo code never holds a write token (check.sh step 10b enforces it):
#   build   read-only, no persisted credentials: runs tracker.py --strict, uploads the files;
#   publish write access, runs only git: commits the files to `tracker` if more than the timestamp changed.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tracker
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "pyyaml>=6"
      - name: Build the tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tracker.py --fetch --strict --out "$RUNNER_TEMP/tracker" --summary | tee "$RUNNER_TEMP/summary.txt"
          cp "$RUNNER_TEMP/summary.txt" "$RUNNER_TEMP/tracker/summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tracker
          path: ${{ runner.temp }}/tracker
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: tracker
          path: ${{ runner.temp }}/tracker
      - name: Publish to the tracker branch
        run: |
          pub="$RUNNER_TEMP/pub"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin tracker >/dev/null; then
            git fetch -q origin tracker
            git worktree add -q --detach "$pub" origin/tracker
          else
            git worktree add -q --detach "$pub"
            git -C "$pub" checkout -q --orphan tracker
            git -C "$pub" rm -rqf .
          fi
          for f in README.md PLAN.md PROGRESS.md REMAINING.md FUTURE.md; do cp "$RUNNER_TEMP/tracker/$f" "$pub/$f"; done
          cd "$pub"
          git add README.md PLAN.md PROGRESS.md REMAINING.md FUTURE.md
          # Only the "as of" time changed: nothing to publish.
          if git diff --cached --quiet -I ' · as of ' -I '^Tracker .* IST:'; then echo "no change"; exit 0; fi
          git commit -qm "tracker: $(head -1 "$RUNNER_TEMP/tracker/summary.txt" | cut -c1-150)"
          git push -q origin HEAD:refs/heads/tracker
