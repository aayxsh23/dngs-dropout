# The professor's rubric (minimum / expected / advanced for A/A* targets) mapped to the tasks that deliver it.
# PROGRESS.md shows how much of each item is done; an item with no tasks is a gap.
rubric:
  - {level: minimum,  item: "Clearly defined problem",                                tasks: [AY-16, DS-20]}
  - {level: minimum,  item: "Dataset understanding and preprocessing",                tasks: [AY-20, DS-14, DS-25]}
  - {level: minimum,  item: "At least two methods compared, or a research gap addressed", tasks: [EXP-T1, DS-16]}
  - {level: minimum,  item: "Experimental evaluation and comparison",                 tasks: [EXP-T1, EXP-P, EXP-G, DS-16, DS-17]}
  - {level: minimum,  item: "Complete executable code and report (reproducibility stated)", tasks: [AY-12, AY-29, AY-31, SUBMIT]}
  - {level: expected, item: "At least three models studied and compared (A-E, D_hard, D_soft)", tasks: [EXP-T1, EXP-P, DS-16]}
  - {level: expected, item: "Feature engineering and normalization (depth normalization, inputs, scene factors)", tasks: [AY-16, DS-14, DS-25]}
  - {level: expected, item: "Hyperparameter tuning or understanding (dropout dose; depth weight)", tasks: [EXP-G, DS-17]}
  - {level: expected, item: "Detailed analysis with intermediate results (why and how)", tasks: [AY-23, AY-25, DS-19]}
  - {level: expected, item: "Justification of the best-performing variant by the metrics", tasks: [AY-26, DS-21]}
  - {level: advanced, item: "Research problem and gap clearly defined",               tasks: [AY-16, DS-13, DS-20]}
  - {level: advanced, item: "Novel formulation or meaningful extension (placement, clamp theory)", tasks: [AY-16, EXP-P, AY-25]}
  - {level: advanced, item: "Advanced optimization (decoupled recipe; clamp-safe variant)", tasks: [AY-26]}
  - {level: advanced, item: "Robust experimental validation (8x3, Holm, margin, noise floor, pre-registration)", tasks: [AY-12, EXP-T1, EXP-N, AY-25, DS-19]}
  - {level: advanced, item: "Explainability and interpretation",                     tasks: [AY-23, AY-25, AY-26]}
  - {level: advanced, item: "Potential for further research or publication",           tasks: [AY-27, DRAFT]}
  - {level: advanced, item: "Reproducibility of code and results",                    tasks: [AY-12, AY-29, DS-19]}
  - {level: advanced, item: "GitHub repo with a proper README",                       tasks: [AY-31]}
  - {level: advanced, item: "Project website with details and results",              tasks: [DS-26, AY-32]}
  - {level: advanced, item: "Communicate approach, findings and limitations",         tasks: [AY-27, DRAFT, VIVA]}

# Future prospects. READY means: every `requires` task is done, nothing is overdue, and it is before
# `latest_start`. To adopt one, copy it into `tasks` (docs-only PR). After `latest_start` it moves to the
# publication path (PLAN_V2 §11).
prospects:
  - id: FP-1
    title: "Clamp-safe dropout (variant F): in the hard-depth pass use base opacity min(0.95, 0.99(1-r)) under the mask, so compensation never hits the 0.99 cap"
    why: "A causal test of H2 and a candidate fix: diagnosis plus remedy is what moves this from a study to a method contribution"
    cost: "0.5 person-day code + 24 runs (8 scenes x 3 seeds) = 2 T4-h; needs tag v1.1-exp"
    requires: [EXP-P, AY-19]
    latest_start: "2026-11-06T12:00:00+05:30"
    value: high
  - id: FP-2
    title: "Depth-weight sensitivity: B and E at depth_scale 0.5 and 2 (seed 0, 8 scenes)"
    why: "Hyperparameter understanding for the second regularizer, not only for dropout"
    cost: "32 runs = 2.6 T4-h; matrix file only"
    requires: [EXP-T1]
    latest_start: "2026-11-06T12:00:00+05:30"
    value: medium
  - id: FP-3
    title: "Region-stratified error (H5): D's excess error over E in flat-depth, low-texture and depth-edge regions"
    why: "Explainability: where in the image the interference lives; analysis only, on saved renders"
    cost: "0.5 person-day, no GPU"
    requires: [FREEZE]
    latest_start: "2026-11-08T12:00:00+05:30"
    value: medium
  - id: FP-4
    title: "Statistics robustness: bootstrap CIs and Wilcoxon tests next to the t-intervals"
    why: "Reviewers ask whether 8-scene t-intervals hold; analysis only"
    cost: "0.5 person-day, no GPU"
    requires: [AY-19]
    latest_start: "2026-11-08T12:00:00+05:30"
    value: medium
  - id: FP-5
    title: "Dense initialization (block S): A-E from MVS point clouds"
    why: "Tests whether the interaction survives a stronger initialization (H6)"
    cost: "40 runs = 3.3 T4-h"
    requires: [FREEZE]
    latest_start: "2026-11-06T23:59:00+05:30"
    value: medium
  - id: FP-6
    title: "Second dataset: DTU 3-view (or Blender 8-view), variants A-E"
    why: "Single-dataset results are the first thing an A/A* reviewer rejects"
    cost: "75-120 runs, DTU masks and evaluation; 2-3 person-days"
