# Project tracker: the single machine-readable plan (PLAN_V2 §7, re-dated 3 Nov after the code freeze slipped).
#
# scripts/tracker.py reads this file plus the evidence (merged PRs, tags, files on main, the **Tracker:** line in
# both context files on the team-context branch) and writes PLAN.md, PROGRESS.md, REMAINING.md and FUTURE.md to
# the `tracker` branch every hour (.github/workflows/tracker.yml). Edit dates, tasks and prospects here, in a
# docs-only PR. Status is never written here: it comes from the evidence.
#
# A task is done when ANY of its `done_when` items holds:
#   pr: N | prs: [N, ...]     PR(s) merged          tag: name     tag exists on origin
#   file: path                file exists on main   runs: {block: T1, n: 120}   summed run count reached
# and also when its ID is listed after "done" on a context file's **Tracker:** line. "partial" there counts half.
# Times are IST. weight: share of the overall percentage (default 1).

