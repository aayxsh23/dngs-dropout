# Block BLENDER: A-E x 8 objects x seeds 0-2, 8 views (120 runs, tag v1.2-exp; EXECUTION_PLAN W2/W3, prereg-v3 §5.2).
# One uniform protocol for every object: scripts/run_blender.sh setting 1 (non-SH path; dropout is ported there only)
# with soft depth left on (no --soft_depth_start 9999999). No spiral video, eval-only render, explicit seed.
# --data_root is data/nerf_synthetic (with DPT depth). Output root: outputs_blender/ -> blender_8v/<variant>/<obj>/seed<k>/.
dataset: blender
scenes: [chair, drums, ficus, hotdog, lego, materials, mic, ship]
seeds: [0, 1, 2]
n_views: [8]
keep_ckpt_seeds: [0]
variants:
  A: {depth_scale: 0, drop_rate: 0.0, depth_render: shared}
  B: {depth_scale: 1, drop_rate: 0.0, depth_render: shared}
  C: {depth_scale: 0, drop_rate: 0.2, depth_render: shared}
  D: {depth_scale: 1, drop_rate: 0.2, depth_render: shared}
  E: {depth_scale: 1, drop_rate: 0.2, depth_render: clean}
train_flags: >-
  -r 2 --eval --rand_pcd --iterations 6000 --lambda_dssim 0.2 --white_background
  --densify_grad_threshold 0.0005 --prune_threshold 0.01 --densify_until_iter 6000 --percent_dense 0.01
  --densify_from_iter 500
  --position_lr_init 0.00016 --position_lr_final 0.0000016 --position_lr_max_steps 1000 --position_lr_start 5000
  --test_iterations 1000 2000 3000 4500 6000 --save_iterations 1000 2000 3000 6000
  --hard_depth_start 0 --split_opacity_thresh 0.1 --error_tolerance 0.001 --scaling_lr 0.005
  --shape_pena 0 --opa_pena 0 --scale_pena 0
steps:
  - "{python} train_blender.py -s {scene_dir} --model_path {work} --n_sparse {n_views} --seed {seed} {variant_flags} {train_flags}"
  - "{python} render.py -s {scene_dir} --model_path {work} -r 2 --skip_train --skip_test"
  - "{python} metrics.py --model_paths {work}"
