# DTU runner smoke (EXECUTION_PLAN A7): A-E on scan8, seed 0, 1100 iterations, through the same steps as matrix_dtu.yaml.
# Run with --allow_untagged on the laptop; post the PSNR table on the v1.2-exp PR. Not an experiment block.
dataset: dtu
scenes: [scan8]
seeds: [0]
n_views: [3]
keep_ckpt_seeds: []
variants:
  A: {depth_scale: 0, drop_rate: 0.0, depth_render: shared}
  B: {depth_scale: 1, drop_rate: 0.0, depth_render: shared}
  C: {depth_scale: 0, drop_rate: 0.2, depth_render: shared}
  D: {depth_scale: 1, drop_rate: 0.2, depth_render: shared}
  E: {depth_scale: 1, drop_rate: 0.2, depth_render: clean}
train_flags: >-
  -r 4 --eval --rand_pcd --iterations 1100 --lambda_dssim 0.6
  --densify_grad_threshold 0.001 --prune_threshold 0.01 --densify_until_iter 6000 --percent_dense 0.1
  --position_lr_init 0.0016 --position_lr_final 0.000016 --position_lr_max_steps 5500 --position_lr_start 500
  --test_iterations 100 1000 2000 3000 4500 6000 --save_iterations 100 500 1000 3000 6000
  --error_tolerance 0.01 --opacity_lr 0.05 --scaling_lr 0.003
  --shape_pena 0.005 --opa_pena 0.001 --scale_pena 0.005
steps:
  - "{python} train_dtu.py --dataset DTU -s {scene_dir} --model_path {work} --n_sparse {n_views} --seed {seed} {variant_flags} {train_flags}"
  - "{python} render.py -s {scene_dir} --model_path {work} -r 4 --skip_train --skip_test"
  - "{python} experiments/eval_dtu.py --model_path {work} --mask_dir {data_root}/submission_data/idrmasks/{scene}"
