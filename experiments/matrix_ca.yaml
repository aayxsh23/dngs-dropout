# Block CA: clamp-aware dropout, H7 (48 runs, Colab T4, tag v1.1-exp; paired with T1's C and D, E and A as references; runs only if the gate in PLAN_V2 §5.1 passes). Runner: experiments/run_matrix.py; layout and keys: PLAN.md W8. Output root: outputs_ca/ (PLAN_V2 §3.1, §5.1).
# Identical to scripts/run_llff.sh except: no spiral video, eval-only render, explicit seed, variant flags.
scenes: [fern, flower, fortress, horns, leaves, orchids, room, trex]
seeds: [0, 1, 2]
n_views: [3]
keep_ckpt_seeds: []   # Drive quota: only T1 seed 0 keeps checkpoints
variants:
  C_ca: {depth_scale: 0, drop_rate: 0.2, depth_render: shared, drop_mode: clamp_aware}
  D_ca: {depth_scale: 1, drop_rate: 0.2, depth_render: shared, drop_mode: clamp_aware}
train_flags: >-
  -r 8 --eval --rand_pcd --iterations 6000 --lambda_dssim 0.2
  --densify_grad_threshold 0.0013 --prune_threshold 0.01 --densify_until_iter 6000 --percent_dense 0.01
  --position_lr_init 0.016 --position_lr_final 0.00016 --position_lr_max_steps 5500 --position_lr_start 500
  --split_opacity_thresh 0.1 --error_tolerance 0.00025 --scaling_lr 0.003
  --shape_pena 0.002 --opa_pena 0.001 --near 10
steps:
  - "{python} train_llff.py -s {scene_dir} --model_path {work} --n_sparse {n_views} --seed {seed} {variant_flags} {train_flags}"
  - "{python} render.py -s {scene_dir} --model_path {work} -r 8 --near 10 --skip_train --skip_test"
  - "{python} metrics.py --model_paths {work}"
